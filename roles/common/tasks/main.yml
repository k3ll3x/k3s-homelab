- name: Install prerequisites
  apt:
    pkg:
      - curl
      - ca-certificates
      - apt-transport-https
      - python3
    state: present
    update_cache: no

- name: Set up authorized keys
  authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.ssh_key }}"
  loop: "{{ users }}"

- name: Allow sudo without password
  copy:
    content: "%sudo ALL=(ALL) NOPASSWD: ALL"
    dest: /etc/sudoers.d/sudo-nopasswd
    mode: 0440

- name: Disable swap
  shell: swapoff -a
  ignore_errors: true

- name: Disable password authentication in SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: Restart SSH service

- name: Configure lid switch to ignore when closed
  lineinfile:
    path: /etc/systemd/logind.conf
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: 'HandleLidSwitch', value: 'ignore' }
    - { key: 'HandleLidSwitchExternalPower', value: 'ignore' }
  notify: Restart systemd-logind

- name: Set default GRUB boot entry to index 1 (second option)
  lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_DEFAULT='
    line: 'GRUB_DEFAULT=1'
    state: present
  notify: Update GRUB

- name: Update GRUB bootloader
  command: update-grub
  register: grub_updated
  changed_when: grub_updated.rc == 0

- name: Restart SSH service
  service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted

- name: Restart systemd-logind
  service:
    name: systemd-logind
    state: restarted

- name: Deploy safe shutdown script
  copy:
    src: "{{ playbook_dir }}/../scripts/safe-shutdown.sh"
    dest: /usr/local/bin/homelab-safe-shutdown.sh
    mode: 0755
