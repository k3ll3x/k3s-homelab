- name: Install prerequisites
  package:
    name:
      - curl
      - ca-certificates
      - python3
    state: present

- name: Set up authorized keys
  authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.ssh_key }}"
  loop: "{{ users }}"

- name: Allow sudo without password (Debian)
  copy:
    content: "%sudo ALL=(ALL) NOPASSWD: ALL"
    dest: /etc/sudoers.d/sudo-nopasswd
    mode: 0440
  when: ansible_os_family == 'Debian'

- name: Allow passwordless doas (Alpine)
  copy:
    content: "permit nopass :wheel\npermit nopass root\n"
    dest: /etc/doas.d/doas.conf
    mode: 0440
  when: ansible_os_family == 'Alpine'

- name: Disable swap
  shell: swapoff -a
  ignore_errors: true

- name: Disable password authentication in SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: Restart SSH service

- name: Configure lid switch to ignore when closed (Debian)
  lineinfile:
    path: /etc/systemd/logind.conf
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: 'HandleLidSwitch', value: 'ignore' }
    - { key: 'HandleLidSwitchExternalPower', value: 'ignore' }
  notify: Restart systemd-logind
  when: ansible_os_family == 'Debian'

- name: Set default GRUB boot entry to index 1 (Debian)
  lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_DEFAULT='
    line: 'GRUB_DEFAULT=1'
    state: present
  notify: Update GRUB
  when: ansible_os_family == 'Debian'

- name: Update GRUB bootloader (Debian)
  command: update-grub
  register: grub_updated
  changed_when: grub_updated.rc == 0
  when: ansible_os_family == 'Debian'

- name: Restart SSH service
  service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted

- name: Restart systemd-logind (Debian)
  service:
    name: systemd-logind
    state: restarted
  when: ansible_os_family == 'Debian'

- name: Deploy safe shutdown script
  copy:
    src: "{{ playbook_dir }}/../scripts/safe-shutdown.sh"
    dest: /usr/local/bin/homelab-safe-shutdown.sh
    mode: 0755
