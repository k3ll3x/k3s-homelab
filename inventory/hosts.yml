all:
  vars:
    ansible_user: "{{ auser | default('nuvhandra') }}"
    ansible_ssh_private_key_file: "{{ ssh_private_key_file | default('/home/atrahasis/.ssh/whitelaptop') }}"
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_pass: ""
    ansible_python_interpreter: /usr/bin/python3

  children:
    k3s_cluster:
      children:
        k3s_server:
          hosts:
            master1:
              ansible_host: "{{ master1_ip | default('192.168.2.94') }}"
              node_ip: "{{ master1_ip | default('192.168.2.94') }}"
        k3s_agent:
          hosts:
            # worker1 commented out until ready
            # worker1:
            #   ansible_host: "{{ worker1_ip | default('192.168.1.11') }}"
            #   node_ip: "{{ worker1_ip | default('192.168.1.11') }}"
