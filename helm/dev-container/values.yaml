replicaCount: 1
image: lscr.io/linuxserver/webtop:arch-xfce
vncPassword: "devpass123"
service:
  type: ClusterIP
  port: 3000
securityContext:
  privileged: true
resources:
  limits:
    memory: 2Gi
    cpu: "1000m"
# The Admin Container is now the Toolbox.
# It includes pre-installed desktop + necessary automation tools.
# We mount Kubeconfig to make it a full control center.
volumeMounts:
  - name: config
    mountPath: /config
  - name: kubeconfig
    mountPath: /config/.kube/config
  - name: webcam
    mountPath: /dev/video0
  - name: usb-devices
    mountPath: /dev/bus/usb
volumes:
  - name: config
    hostPath:
      path: /home/nuvhandra/dev-container/files
  - name: kubeconfig
    hostPath:
      path: /etc/rancher/k3s/k3s.yaml
  - name: webcam
    hostPath:
      path: /dev/video0
  - name: usb-devices
    hostPath:
      path: /dev/bus/usb
nodeSelector:
  llm-ready: "true"

