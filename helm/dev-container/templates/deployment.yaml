apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-container.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "dev-container.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "dev-container.fullname" . }}
    spec:
      containers:
        - name: dev-container
          image: {{ .Values.image }}
          securityContext:
            privileged: true
          env:
            - name: VNC_PW
              value: {{ .Values.vncPassword | quote }}
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
