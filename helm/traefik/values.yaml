image:
  tag: "3.6.0"
service:
  type: LoadBalancer
  spec:
    externalIPs:
      - "192.168.2.94"
ports:
  web: { port: 80, exposedPort: 80 }
  websecure: { port: 443, exposedPort: 443 }
providers:
  kubernetesCRD: { enabled: true }
  kubernetesIngress: { enabled: true }
api:
  dashboard: true
persistence:
  enabled: true
  size: 1Gi
